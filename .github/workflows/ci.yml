name: CI

# Builds the APK and runs the unit tests. There is no Play Store step anywhere in this
# repository: nothing here signs a release, uploads a bundle, or holds a keystore secret.
# The artifacts are an unsigned release APK plus a debug APK, which is what a tester needs
# to sideload a build.
#
# Docs-only changes skip it entirely (skipped only when EVERY changed file matches).
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        # The wire contract lives here: PBKDF2 vectors, packet layout, PCM reassembly, the
        # profile decoder's compatibility rule, and the latency auto-tune's decision function.
        # A failure means this port has stopped speaking the same protocol as the Windows app.
        run: ./gradlew --no-daemon :remsoundkit:testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Build APKs
        # assembleRelease is unsigned on purpose — the release build type declares no signing
        # config, so the output is an -unsigned.apk that has to be signed before it will install.
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: RemSound-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v7
        with:
          name: RemSound-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            remsoundkit/build/reports/tests/**
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
