# Dependency updates. Every library and plugin version in this repo lives in
# gradle/libs.versions.toml, so one "gradle" entry at the root covers both modules.
#
# Patch and minor bumps are grouped into a single PR per ecosystem to keep the
# noise down; majors come through on their own, because the ones that matter here
# (AGP, Kotlin, the Compose BOM) need a human to look at them. Note that the
# Kotlin plugin and the Compose compiler plugin share the `kotlin` version ref,
# so they move together the way they have to.
version: 2

updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: build
    groups:
      gradle-minor-and-patch:
        # Kotlin and AGP are excluded on purpose. Their *minor* releases break the build
        # (Kotlin 2.4 turned the kotlinOptions String DSL into a hard error, and an AGP minor
        # can demand a new Gradle and compileSdk), so they do not belong in the batch that is
        # safe to merge on a green check. They still arrive, just as their own PRs.
        exclude-patterns:
          - "org.jetbrains.kotlin*"
          - "com.android.*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
    groups:
      actions-all:
        update-types:
          - major
          - minor
          - patch
